version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: taobao-db
    environment:
      POSTGRES_USER: ${DB_USER:-taobao_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taobao_password}
      POSTGRES_DB: ${DB_NAME:-taobao_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - taobao-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taobao_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: taobao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taobao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taobao-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-taobao_user}
      DB_PASSWORD: ${DB_PASSWORD:-taobao_password}
      DB_NAME: ${DB_NAME:-taobao_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taobao-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taobao-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - taobao-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Nginx 反向代理（生产环境）
  nginx:
    image: nginx:alpine
    container_name: taobao-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - taobao-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  taobao-network:
    driver: bridge
